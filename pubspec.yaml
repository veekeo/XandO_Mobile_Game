name: xando
description: A new Flutter project.

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  flutterflow_ui: ^0.2.0
  firebase_auth: ^4.15.0
  animated_custom_dropdown: ^2.0.0
  another_flushbar: ^1.12.30
  fl_country_code_picker: ^0.1.7+1
  simple_gradient_text: 1.2.3
  loop_page_view: ^1.2.5
  flutter_keyboard_visibility: ^5.4.1
  pin_code_fields: 7.4.0
  easy_debounce: 2.0.1
  cupertino_icons: ^1.0.2
  auto_size_text: 3.0.0
  cached_network_image: 3.2.1
  flutter_animate: 4.1.1+1
  flutter_cache_manager: 3.3.0
  font_awesome_flutter: 10.1.0
  from_css_color: 2.0.0
  go_router: 7.1.1
  google_fonts: 4.0.3
  intl: 0.18.1
  json_path: 0.6.2
  page_transition: 2.0.4
  path_provider: 2.0.14
  http: ^0.13.6
  path_provider_android: 2.0.25
  path_provider_foundation: 2.2.2
  path_provider_platform_interface: 2.0.6
  plugin_platform_interface: 2.1.3
  provider: 6.0.4
  shared_preferences: 2.0.15
  shared_preferences_android: 2.1.0
  shared_preferences_ios: 2.1.1
  shared_preferences_platform_interface: 2.2.0
  shared_preferences_web: 2.1.0
  smooth_page_indicator: 1.0.1
  sqflite: 2.2.6
  timeago: 3.2.2
  url_launcher: 6.1.10
  url_launcher_android: 6.0.27
  url_launcher_ios: 6.1.4
  url_launcher_platform_interface: 2.1.2
  firebase_core: ^2.24.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^2.0.0


flutter:

  uses-material-design: true


  assets:
    - assets/images/


  fonts:
    - family: Bold
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf

    - family: Medium
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf

    - family: Regular
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf

    - family: Light
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
  
